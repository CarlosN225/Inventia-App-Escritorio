<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-inventia-sf.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1668e3" />
    <meta name="description" content="INVENTIA — Sistema de control de inventario para tu negocio" />
    <script>
    try {
    var t = localStorage.getItem('inventia.tema');
    var oscuro = t === 'oscuro' || (t === 'sistema' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = oscuro ? 'dark' : 'light';
    } catch (e) {}
</script>
    <title>INVENTIA · Control de inventario</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
